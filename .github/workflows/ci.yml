name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      MCA_SELECTOR_JAR: ${{ github.workspace }}/.tools/mcaselector-2.8-mctraveler1.jar
    steps:
      # Local actions must be checked out before GitHub can load them.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: ./gradlew test --no-daemon -PmcaSelectorJar="$MCA_SELECTOR_JAR" -Pmctraveler.testForks="$(nproc)"

  gametest:
    runs-on: ubuntu-latest
    env:
      MCA_SELECTOR_JAR: ${{ github.workspace }}/.tools/mcaselector-2.8-mctraveler1.jar
    steps:
      # Local actions must be checked out before GitHub can load them.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build (gametests)
        run: ./gradlew build -x test --no-daemon -PmcaSelectorJar="$MCA_SELECTOR_JAR"
      - name: Production smoke
        run: ./gradlew prodServer --no-daemon -PmcaSelectorJar="$MCA_SELECTOR_JAR"

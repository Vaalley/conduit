# Gradle performance — keeps the incremental dev loop seconds-scale (see docs/dev-loop.md)
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Kotlin (incremental compilation is the K2 default; stated explicitly on purpose)
kotlin.incremental=true
kotlin_version=2.4.10

# Fabric platform — versions verified against docs/research/fabric-kotlin-platform.md
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.17
fabric_api_version=0.156.0+26.2
# flk = fabric-language-kotlin (bundles the Kotlin runtime for mods)
flk_version=1.13.13+kotlin.2.4.10

# Mod
mod_version=0.1.0
maven_group=eu.mctraveler
